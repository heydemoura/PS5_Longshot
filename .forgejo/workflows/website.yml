# The player website (website/, Astro) on Cloudflare: longshot.magicbean.dev, the Worker longshot-website.
# - A push to main that changes website/ or the tested-run sources (or Run workflow) builds it, runs its checks and
#   deploys it. It is also rebuilt every hour, since the build collects progress data from Forgejo (website/PROGRESS.md).
# - A pull request that changes those sources is built and checked (job check), on a runner with no secrets.
# - It also gets a preview: its built site (dist/) is uploaded as a new version of the Worker (`wrangler versions
#   upload`, which leaves the site as it is) with the alias pr-<number>, served at
#   https://pr-<number>-longshot-website.<subdomain>.workers.dev, and the link is posted on the PR.
#
# A pull request's code never runs where the Cloudflare token can be opened. The token is sealed, and the seal broker
# hands seal.key only to a job of main's own workflow files (docs/dev/reference/ci.md, Secrets only our runners can
# open). So a preview is two jobs of pull_request_target, which runs this file from main, not from the PR:
# - preview-build checks out the PR (allow-unsafe-pr-checkout), builds it and uploads dist/ as an artifact, on a runner
#   with no seal.key and no ID token: npm ci and the build are the PR's code;
# - preview-upload (runs-on: deploy) checks out main, takes the PR's dist/ as files only, and uploads it with main's
#   wrangler, main's wrangler.jsonc and main's worker/index.ts. A PR's change to the Worker itself shows in its preview
#   only once merged.
# Previewed: a PR from a branch of Longshot itself, which only people who may push to it can make, on every push; any
# other PR (from a fork) when a maintainer adds the label `preview`, after reading its changes. The label approves the
# commit the PR is at: the run checks it is still that commit, then takes the label off, so a later push needs the label
# again. Only a deploy applies the Worker's domain, and only main deploys.
#
# No game data is involved.
#
# Secrets (organisation or repository, Actions, Secrets): CLOUDFLARE_API_TOKEN_SEALED (Account, Workers Scripts: Edit;
# Zone, Workers Routes: Edit on magicbean.dev for the custom domain) and CLOUDFLARE_ACCOUNT_ID. Optional:
# PREVIEW_COMMENT_TOKEN_SEALED, a Forgejo token with write:issue: a fork's run gets a read-only job token, so without it
# the link is only in the run's log and the label stays on. The _SEALED ones are sealed (scripts/ci_secret.sh): only a
# job of main (enable-openid-connect, SEAL_BROKER_PIN) gets the seal.key that opens them.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/tested-configurations.md', 'docs/tested/**', '.forgejo/workflows/website.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['website/**', 'docs/tested-configurations.md', 'docs/tested/**', '.forgejo/workflows/website.yml']
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths: ['website/**', 'docs/**', 'CONTRIBUTING.md', '.forgejo/workflows/website.yml']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  # (main: build, check and deploy, with main's code only)
  deploy:
    name: Website on Cloudflare
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
    runs-on: deploy  # (the runner kept for deploys; the seal broker opens nothing for a run that isn't main's)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    enable-openid-connect: true   # (the ID token the seal broker checks: this job only)
    timeout-minutes: 20
    env:
      SEAL_BROKER_PIN: ${{ vars.SEAL_BROKER_PIN }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a website
        id: site
        run: |
          if [ -f website/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No website/ at this commit: nothing to build"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build and check
        if: steps.site.outputs.present == 'true'
        working-directory: website
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run build
          npm run check

      - name: Deploy
        if: steps.site.outputs.present == 'true'
        working-directory: website
        env:
          SEALED: ${{ secrets.CLOUDFLARE_API_TOKEN_SEALED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$SEALED" | ../scripts/ci_secret.sh unseal)
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          npx wrangler deploy --message "main @ ${GITHUB_SHA:0:12}"

  # (a pull request: built and checked, no secret, no deploy runner)
  check:
    name: Website builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check
        run: |
          if [ ! -f website/package.json ]; then echo "::notice::No website/ at this commit: nothing to build"; exit 0; fi
          cd website
          node --version
          npm ci --no-audit --no-fund
          npm run build
          npm run check

  # (a preview, 1 of 2: the PR's code, built where nothing can be opened)
  preview-build:
    name: Website preview, build
    if: >-
      github.event_name == 'pull_request_target' && (
        (github.event.action != 'labeled' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    outputs:
      present: ${{ steps.site.outputs.present }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ format('refs/pull/{0}/head', github.event.pull_request.number) }}
          allow-unsafe-pr-checkout: true   # (this job has no seal.key and no ID token: the PR's code opens nothing here)

      - name: Check it is the approved commit
        run: |
          got=$(git rev-parse HEAD)
          if [ "$got" != "$HEAD_SHA" ]; then
            echo "::error::The PR is at $got now, not $HEAD_SHA: read the new changes, then add the label again"
            exit 1
          fi

      - name: Is there a website
        id: site
        run: |
          if [ -f website/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No website/ at this commit: nothing to build"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build and check
        if: steps.site.outputs.present == 'true'
        working-directory: website
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run build
          npm run check

      - if: steps.site.outputs.present == 'true'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: error
          retention-days: 1

  # (a preview, 2 of 2: main's code uploads the PR's dist/, files only)
  preview-upload:
    name: Website preview, upload
    needs: [preview-build]
    if: >-
      always() && github.event_name == 'pull_request_target' && (
        (github.event.action != 'labeled' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    runs-on: deploy  # (the runner kept for deploys; the seal broker opens nothing for a run that isn't main's)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    enable-openid-connect: true   # (the ID token the seal broker checks: this job only, which runs main's code only)
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SEAL_BROKER_PIN: ${{ vars.SEAL_BROKER_PIN }}
      BUILT: ${{ needs.preview-build.result == 'success' && needs.preview-build.outputs.present == 'true' }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}   # (main, never the PR)

      - name: Main's wrangler
        if: env.BUILT == 'true'
        working-directory: website
        run: npm ci --no-audit --no-fund

      - if: env.BUILT == 'true'
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e   # v4 (4.1.4 with the GHES check off)
        with:
          name: website-dist
          path: website/dist

      - name: Upload the preview
        id: upload
        if: env.BUILT == 'true'
        working-directory: website
        env:
          SEALED: ${{ secrets.CLOUDFLARE_API_TOKEN_SEALED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$SEALED" | ../scripts/ci_secret.sh unseal)
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          npx wrangler versions upload --preview-alias "pr-$PR_NUMBER" \
            --tag "pr-$PR_NUMBER" --message "PR #$PR_NUMBER @ ${HEAD_SHA:0:12}" | tee "$RUNNER_TEMP/upload.log"
          alias_url=$(sed -n 's/.*Version Preview Alias URL: \(https:[^ ]*\).*/\1/p' "$RUNNER_TEMP/upload.log" | tail -n 1)
          version_url=$(sed -n 's/.*Version Preview URL: \(https:[^ ]*\).*/\1/p' "$RUNNER_TEMP/upload.log" | tail -n 1)
          if [ -z "$alias_url" ]; then
            echo "::error::Wrangler printed no preview URL: the Worker's preview URLs are off (a deploy turns them on), or the account has no workers.dev subdomain"
            exit 1
          fi
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "version_url=$version_url" >> "$GITHUB_OUTPUT"

      - name: Post the link on the pull request
        if: steps.upload.outputs.alias_url != ''
        env:
          SEALED: ${{ secrets.PREVIEW_COMMENT_TOKEN_SEALED }}
          JOB_TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
        run: |
          # (PREVIEW_COMMENT_TOKEN_SEALED when it is set and the seal broker's key opens it; else the job's own token)
          FORGEJO_TOKEN=$JOB_TOKEN
          if [ -n "$SEALED" ] && token=$(printf '%s' "$SEALED" | scripts/ci_secret.sh unseal); then
            echo "::add-mask::$token"
            FORGEJO_TOKEN=$token
          fi
          export FORGEJO_TOKEN
          node - <<'EOF'
          const { API, FORGEJO_TOKEN, PR_NUMBER, HEAD_SHA, ALIAS_URL, VERSION_URL } = process.env;
          const marker = '<!-- website-preview -->';
          const body = [
            marker,
            `**Website preview:** ${ALIAS_URL}`,
            '',
            `This commit (${HEAD_SHA.slice(0, 12)}) on its own: ${VERSION_URL || 'n/a'}`,
          ].join('\n');
          const call = async (method, path, data) => {
            const r = await fetch(API + path, {
              method,
              headers: { Authorization: `token ${FORGEJO_TOKEN}`, 'Content-Type': 'application/json' },
              body: data && JSON.stringify(data),
            });
            if (!r.ok) throw new Error(`${method} ${path}: ${r.status} ${await r.text()}`);
            return r.status === 204 ? null : r.json();
          };
          (async () => {
            const comments = await call('GET', `/issues/${PR_NUMBER}/comments?limit=50`);
            const mine = comments.find((c) => c.body.startsWith(marker));
            if (mine) await call('PATCH', `/issues/comments/${mine.id}`, { body });
            else await call('POST', `/issues/${PR_NUMBER}/comments`, { body });
          })().catch((e) => {
            console.log(body);
            console.log(`::warning::Couldn't post the link on the PR (${e.message.slice(0, 200)}): it is above. A fork's run needs the PREVIEW_COMMENT_TOKEN_SEALED secret to comment.`);
          });
          EOF

      - name: Take the label off
        if: always() && github.event.action == 'labeled'
        env:
          SEALED: ${{ secrets.PREVIEW_COMMENT_TOKEN_SEALED }}
          JOB_TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          LABEL_ID: ${{ github.event.label.id }}
        run: |
          # (PREVIEW_COMMENT_TOKEN_SEALED when it is set and the seal broker's key opens it; else the job's own token)
          FORGEJO_TOKEN=$JOB_TOKEN
          if [ -n "$SEALED" ] && token=$(printf '%s' "$SEALED" | scripts/ci_secret.sh unseal); then
            echo "::add-mask::$token"
            FORGEJO_TOKEN=$token
          fi
          export FORGEJO_TOKEN
          curl -sS -f -X DELETE -H "Authorization: token $FORGEJO_TOKEN" "$API/issues/$PR_NUMBER/labels/$LABEL_ID" \
            || echo "::warning::Couldn't take the label off: take it off by hand before adding it again"
